[package]
name = "loggrep"
version = "0.1.0"
edition = "2021"
description = "A smarter log parser with color-coded severity, time filtering, regex matching, and stats"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
notify = "6"
